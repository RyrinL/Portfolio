<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Portfolio</title>
  <meta name="description" content="Software developer portfolio" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0a0809" />
  <script>
    // Flag JS and decide the first screen before first paint.
    (function () {
      var root = document.documentElement;
      root.classList.add("js");
      try {
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) root.classList.add("reduced");
        // Returning visitor? Skip straight past sleep + sign-in.
        var booted = localStorage.getItem("nonos.booted") === "1";
        // Deep links (#projects, #about, #experience) skip sleep + sign-in, e.g. for a link on the CV.
        var deep = /^#(projects|about|experience|desktop)$/.test(location.hash);
        root.setAttribute("data-state", booted || deep ? "desktop" : "sleep");
        // Front portfolio: shown first to everyone (new and returning) on wide screens.
        // Deep links and #desktop go straight to the OS. Phones keep the plain #mobile page.
        var wide = matchMedia("(min-width: 761px)").matches;
        root.setAttribute("data-front", wide && !deep ? "on" : "off");
      } catch (e) {
        root.setAttribute("data-state", "sleep");
        root.setAttribute("data-front", "off");
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=12" />
  <link rel="stylesheet" href="front.css?v=14" />
  <link rel="stylesheet" href="notes.css?v=1" />
</head>
<body>
  <!-- ambient layers -->
  <div class="grain" aria-hidden="true"></div>
  <div class="cursor" id="cursor" aria-hidden="true"></div>

  <!-- ================= FRONT: normal portfolio, sits above the OS (front.js) ================= -->
  <!-- Loader: static so it covers the page before first paint (no flash of the OS while scripts load).
       Shown only when data-front="on"; front.js animates it away. A CSS failsafe hides it after 8s. -->
  <div class="f-loader" id="fLoader" aria-hidden="true">
    <p class="f-loader-word"><span class="f-loader-dot"></span><span id="fLoaderWord"></span></p>
    <div class="f-loader-curve"></div>
  </div>
  <div class="front" id="front"></div>

  <!-- ================= OS ================= -->
  <div class="os" id="os">

    <!-- SLEEP -->
    <section class="screen sleep" id="sleep" aria-label="Asleep">
      <div class="sleep-inner">
        <p class="sleep-clock" id="sleepClock"></p>
        <p class="sleep-prompt">press any key to wake</p>
      </div>
      <span class="sleep-word" id="sleepWord" aria-hidden="true"></span>
      <button class="skip" type="button" data-skip>skip to portfolio <span aria-hidden="true">&rarr;</span></button>
    </section>

    <!-- SIGN IN -->
    <section class="screen lock" id="lock" aria-label="Sign in">
      <div class="lock-inner">
        <div class="avatar" id="avatar" aria-hidden="true"></div>
        <p class="lock-name" id="lockName"></p>
        <form class="lock-form" id="lockForm" autocomplete="off">
          <input class="lock-field" id="lockField" type="password" placeholder="" aria-label="Password" />
          <button class="lock-go" id="lockGo" type="submit" aria-label="Sign in">→</button>
        </form>
        <p class="lock-hint" id="lockHint"></p>
      </div>
      <button class="skip" type="button" data-skip>skip to portfolio <span aria-hidden="true">&rarr;</span></button>
    </section>

    <!-- DESKTOP -->
    <div class="desktop" id="desktop">
      <!-- menu bar -->
      <div class="menubar" id="menubar">
        <div class="mb-left">
          <button class="mb-brand" id="mbBrand" aria-haspopup="true" aria-expanded="false">非</button>
          <span class="mb-app" id="mbApp">Finder</span>
        </div>
        <div class="mb-right">
          <span class="mb-presence" id="presence" title="" aria-hidden="true"></span>
          <span class="mb-clock" id="clock"></span>
        </div>
        <!-- brand dropdown -->
        <div class="mb-menu" id="mbMenu" hidden>
          <button data-act="about">About this machine</button>
          <div class="mb-sep"></div>
          <button data-act="reset">Reset experience…</button>
        </div>
      </div>

      <!-- wallpaper + icons -->
      <div class="wallpaper" id="wallpaper">
        <div class="desk-icons" id="deskIcons" aria-label="Desktop"></div>
      </div>

      <!-- window host -->
      <div class="windows" id="windows"></div>

      <!-- dock -->
      <div class="dock" id="dock"></div>
    </div>
  </div>

  <!-- ================= MOBILE: one plain page, filled by portfolio.js ================= -->
  <main class="mobile" id="mobile"></main>

  <!-- ================= ARCHIVE ================= -->
  <section class="archive" id="archive" aria-hidden="true">
    <div class="ar-grain" aria-hidden="true"></div>
    <div class="ar-wrap" id="arWrap"></div>
  </section>

  <!-- toasts + modals -->
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="modal-host" id="modalHost" hidden></div>

  <!-- front motion libraries (pinned versions). If a CDN fails, front.js falls back to native scroll. -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>
  <script src="content.js?v=13"></script>
  <script src="portfolio.js?v=11"></script>
  <script src="front.js?v=21"></script> <!-- must load before os.js: its keydown guard has to register first -->
  <script src="os.js?v=12"></script>
  <script src="notes.js?v=1"></script> <!-- after os.js: renders the owner's sticky notes onto the desktop -->

</body>
</html>
